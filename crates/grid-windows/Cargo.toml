[package]
name = "grid-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
grid-core = { path = "../grid-core" }
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Draws the text of the splash and tray menu. Slint already uses it (same version and features)
# to draw the settings window's text, so it adds little and both look the same.
swash = { version = "0.2.10", default-features = false, features = ["std", "scale", "render"] }
